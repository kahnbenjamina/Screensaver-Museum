<!DOCTYPE html>
<HTML>
    <HEAD>
        <META name="robots" content="noai, noimageai, noindex, noimageindex, nofollow, nosnippet, noarchive"/>
        <META name="viewport" content="width=device-width"/>
        <LINK rel="icon" href="assets/favicon.ico" type="image/x-icon"> 
        <LINK rel="stylesheet" type="text/css" href="museum.css"/>
        <TITLE>Screensaver Museum Template</TITLE>
    </HEAD>
    <BODY>
        <!-- Welcome header -->
        <DIV class="header">
            <A href="" style="padding-right:5px; align-self:center;"><IMG src="assets/toaster.png" alt="A flying toaster facing right." width="48" height="48" style="transform:scaleX(-1)"></A>
            <DIV style="flex-direction:column; width:100%;">
                <A>Welcome to the...<BR></A>
                <A style="font-size:2em;"><I><B>Screensaver Museum</B></I></A>
            </DIV>
            <A id="output" style="font-size:0.9em; align-self:flex-end; white-space:nowrap;"></A>
            <!-- Chooses random phrase for header. TO DO: store outside of html -->
            <SCRIPT>  
                const msgs = ['Saving the world one screen at a time.', 'On Mighty Toaster Wings!', 'Traversing the 3D Maze.', 'Screensavers rule :)', 'Where would you like to go today?', 'Screensavers are awesome!', 'The Ultimate Screensaver Collection', 'Save your monitor screen!'];
                const curMsg = `<SPAN><I>${msgs[Math.floor(Math.random() * msgs.length)]}</I></SPAN>`;
                const outputElement = document.getElementById("output");
                outputElement.innerHTML = curMsg;
            </SCRIPT>  
        </DIV>
        <DIV class="content">
            <!-- Left-hand nav bar (contents and links) -->
            <DIV style="background-color:#00000095; width:18.75%;">
                <DIV class="sidenav">
                    <A href="" style="padding-top:0px;">Home</A>
                    <A href="">Articles</A>
                    <P>Exhibits&emsp;&#9660;</SPAN></P>
                    <A class="sublink" href="">&emsp;Timeline</A>
                    <A class="sublink" href="">&emsp;Notable Screensavers</A>
                    <A class="sublink" href="">&emsp;In the Collection</A>
                    <P>About&emsp;&#9660;</SPAN></P>
                    <A class="sublink" href="">&emsp;About the Project</A>
                    <A class="sublink" href="">&emsp;FAQs</A>
                    <DIV class="linkicons">
                        <A href="https://bsky.app/profile/screensavermuseum.neocities.org" target="_blank" rel="noopener noreferrer"><IMG src="assets/bskylogo.png" alt="The Bluesky logo." width="32" height="32"></A>
                        <A href="https://www.youtube.com/@ScreensaverMuseum" target="_blank" rel="noopener noreferrer"><IMG src="assets/ytlogo.png" alt="The YouTube logo." width="32" height="32"></A>
                        <A href="https://archive.org/details/@screensaver_museum" target="_blank" rel="noopener noreferrer"><IMG src="assets/archivelogo.png" alt="The Internet Archive logo." width="32" height="32"></A>
                    </DIV>
                </DIV>    
            </DIV>
            <!-- Main section where page content goes -->
            <DIV class="main">
                <H1>Title goes here</H1>
                <HR>
                <P>Content goes here.</P>
                <HR>
                <P style="padding-top:3px; font-size:0.9rem;">Last updated: <B>insert date here</B>.</P>
            </DIV>
            <!-- Right-hand sidebar (SOTD and archive link) -->
            <DIV style="width:18.75%; background-color:#00000095;">
                <DIV style="position:-webkit-sticky; position:sticky; top:0%;">
                    <H3 style="padding:8px; padding-top:14px; margin:0px;">Screensaver of the Day!</H3>
                    <!-- Embeds latest screensaver of the day bluesky post -->
                    <SCRIPT type="module" src="https://cdn.jsdelivr.net/npm/bsky-embed/dist/bsky-embed.es.js" async></SCRIPT>
                    <BSKY-EMBED username="screensavermuseum.neocities.org" filter="posts_with_video" mode="dark" limit="1" custom-styles-file="bskyembed.css"></BSKY-EMBED>
                    <P style="font-size:0.75em; padding-left:8px;"><A href="" style="color:#e0e0e0; text-align:right;"><I>Archive</I></A></P>
                </DIV>
            </DIV>
        </DIV>
        <!-- Visitor counter -->
        <DIV class="viscount">
            <IFRAME src="https://404city.neocities.org/widget/visitorCounterV6?sitename=screensavermuseum&css=https://screensavermuseum.neocities.org/visitcount.css&digits=6" width="300" height="100" frameborder="0" scrolling="no"></IFRAME>
        </DIV>
    </BODY>
</HTML>
